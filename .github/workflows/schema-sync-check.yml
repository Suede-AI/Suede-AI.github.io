name: Schema sync check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: check-notes.mjs compares each note's last commit date
          # with its dateModified, which a shallow clone cannot answer.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-schema-sync.mjs
      - run: node scripts/check-notes.mjs
